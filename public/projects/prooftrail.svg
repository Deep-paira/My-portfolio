<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Warm Ochre Gold Accent Gradient -->
    <linearGradient id="amberButtonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59344"/>
      <stop offset="100%" stop-color="#B7863A"/>
    </linearGradient>

    <!-- Subtle Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- ============================================================ -->
  <!-- LEFT HALF: DARK NAVY EDITORIAL BRAND PANEL (#0B1320)         -->
  <!-- ============================================================ -->
  <rect x="0" y="0" width="800" height="1000" fill="#0B1320"/>

  <!-- Top Brand Lockup -->
  <g transform="translate(90, 85)">
    <!-- Shield Logo -->
    <rect width="36" height="36" rx="10" fill="#141E30" stroke="#B7863A" stroke-width="1.8"/>
    <path d="M 18 10 L 26 14 C 26 23, 18 29, 18 29 C 18 29, 10 23, 10 14 Z" fill="none" stroke="#B7863A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 14 19 L 17 22 L 23 16" fill="none" stroke="#F6E0B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brand Name -->
    <text x="48" y="25" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">
      ProofTrail
    </text>
  </g>

  <!-- Central Editorial Quote -->
  <g transform="translate(90, 460)">
    <text font-family="Georgia, serif" font-size="44" font-weight="400" fill="#FFFFFF" line-height="1.25">
      <tspan x="0" dy="0">"Every claim on your passport</tspan>
      <tspan x="0" dy="64">traces back to real, verified</tspan>
      <tspan x="0" dy="64">evidence."</tspan>
    </text>

    <!-- Philosophy Sub-tags -->
    <text x="0" y="210" font-family="sans-serif" font-size="16" fill="#8892A4" letter-spacing="0.5">
      Skill Passport · Explainable Matching · Institutional Verification
    </text>
  </g>

  <!-- Bottom SIH Metadata -->
  <g transform="translate(90, 920)">
    <text font-family="monospace" font-size="13" fill="#4B5568" letter-spacing="2">
      SIH 2026 · SOAIDEATHON-S30
    </text>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT HALF: WARM CREAM AUTHENTICATION PANEL (#F7F6F1)        -->
  <!-- ============================================================ -->
  <rect x="800" y="0" width="800" height="1000" fill="#F7F6F1"/>

  <!-- Centered Login Container -->
  <g transform="translate(980, 240)">
    
    <!-- Heading -->
    <text font-family="Georgia, serif" font-size="38" font-weight="700" fill="#18181B">
      Welcome back
    </text>
    <text y="36" font-family="sans-serif" font-size="15" fill="#71717A">
      Log in to continue building your verified skill identity.
    </text>

    <!-- Input 1: Email -->
    <g transform="translate(0, 80)">
      <text font-family="sans-serif" font-size="13" font-weight="600" fill="#3F3F46">
        Email
      </text>
      <rect y="12" width="440" height="48" rx="8" fill="#FFFFFF" stroke="#B7863A" stroke-width="1.5" filter="url(#cardShadow)"/>
      <text x="18" y="42" font-family="monospace" font-size="14" fill="#18181B">
        deeppaira45@gmail.com
      </text>
      <!-- Subtle Cursor -->
      <line x1="210" y1="26" x2="210" y2="46" stroke="#B7863A" stroke-width="1.8"/>
    </g>

    <!-- Input 2: Password -->
    <g transform="translate(0, 168)">
      <text font-family="sans-serif" font-size="13" font-weight="600" fill="#3F3F46">
        Password
      </text>
      <rect y="12" width="440" height="48" rx="8" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.2" filter="url(#cardShadow)"/>
      <text x="18" y="44" font-family="sans-serif" font-size="18" fill="#A1A1AA" letter-spacing="3">
        ••••••••
      </text>
    </g>

    <!-- Log in Button (#B7863A) -->
    <g transform="translate(0, 256)">
      <rect width="440" height="48" rx="8" fill="url(#amberButtonGrad)" filter="url(#cardShadow)"/>
      <text x="220" y="30" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        Log in
      </text>
    </g>

    <!-- Demo Accounts Card -->
    <g transform="translate(0, 332)">
      <rect width="440" height="96" rx="10" fill="#EDEAE1" fill-opacity="0.65" stroke="#E2DDD2" stroke-width="1"/>
      <text x="20" y="30" font-family="sans-serif" font-size="12" fill="#71717A">
        Demo accounts · password DemoPass123!
      </text>

      <!-- Pill Buttons -->
      <g transform="translate(20, 46)">
        <rect width="72" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8"/>
        <text x="36" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#3F3F46" text-anchor="middle">Student</text>

        <rect x="80" width="82" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8"/>
        <text x="121" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#3F3F46" text-anchor="middle">Institution</text>

        <rect x="170" width="76" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8"/>
        <text x="208" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#3F3F46" text-anchor="middle">Employer</text>

        <rect x="254" width="64" height="30" rx="15" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8"/>
        <text x="286" y="20" font-family="sans-serif" font-size="11" font-weight="500" fill="#3F3F46" text-anchor="middle">Admin</text>
      </g>
    </g>

    <!-- Footer Register Link -->
    <g transform="translate(0, 465)">
      <text x="220" y="0" font-family="sans-serif" font-size="13" text-anchor="middle">
        <tspan fill="#71717A">New to ProofTrail? </tspan>
        <tspan fill="#B7863A" font-weight="600">Create an account</tspan>
      </text>
    </g>

  </g>

</svg>
